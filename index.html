<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CJ Horários</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f4f6fb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --bg:#f4f6fb;
    --bg-elev:#ffffff;
    --card:#ffffff;
    --border:#e3e8f2;
    --text:#1c2333;
    --text-dim:#707a8f;
    --accent:#3568f0;
    --accent-2:#5b8bff;
    --accent-dim:#e9eefd;
    --danger:#e0453f;
    --danger-dim:#fdecea;
    --ok:#1fa971;
    --ok-dim:#e7f8f0;
    --warn:#e08a1f;
    --warn-dim:#fdf1e0;
    --fc:#12b3a0;
    --fo:#f2673d;
    --radius:14px;
    --shadow:0 1px 3px rgba(20,30,60,.06),0 1px 2px rgba(20,30,60,.04);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg);color:var(--text);min-height:100vh;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .screen{display:none;min-height:100vh;flex-direction:column;}
  .screen.active{display:flex;}
  header.top{
    padding:20px 20px 16px;display:flex;align-items:center;justify-content:space-between;
    border-bottom:1px solid var(--border);background:var(--bg-elev);
  }
  header.top h1{font-size:17px;font-weight:700;margin:0;letter-spacing:.2px;}
  header.top .sub{font-size:12px;color:var(--text-dim);margin-top:2px;}
  .btn-icon{background:none;border:none;color:var(--text-dim);font-size:20px;padding:6px;}

  /* LOGIN */
  #login{align-items:center;justify-content:center;padding:24px;background:var(--bg);}
  .login-box{width:100%;max-width:340px;text-align:center;}
  .logo{
    width:64px;height:64px;border-radius:18px;background:linear-gradient(145deg,var(--accent-2),var(--accent));
    display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 18px;
    box-shadow:0 10px 24px rgba(53,104,240,.28);
  }
  .login-box h2{margin:0 0 4px;font-size:20px;}
  .login-box p{color:var(--text-dim);font-size:13px;margin:0 0 28px;}
  .pin-dots{display:flex;justify-content:center;gap:12px;margin-bottom:28px;}
  .pin-dots span{width:12px;height:12px;border-radius:50%;background:var(--border);transition:.15s;}
  .pin-dots span.filled{background:var(--accent);}
  .keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:280px;margin:0 auto;}
  .keypad button{
    aspect-ratio:1;border-radius:50%;border:1px solid var(--border);background:var(--card);
    color:var(--text);font-size:20px;font-weight:500;box-shadow:var(--shadow);
  }
  .keypad button:active{background:var(--accent-dim);}
  .keypad button.wide{grid-column:span 1;}
  #login-error{color:var(--danger);font-size:13px;height:18px;margin-top:14px;}

  /* HUB */
  #hub .apps-grid{padding:20px;display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .app-tile{
    background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:20px 16px;text-align:left;position:relative;overflow:hidden;box-shadow:var(--shadow);
  }
  .app-tile.dead{opacity:.5;}
  .app-tile .icon{font-size:26px;display:block;margin-bottom:10px;}
  .app-tile .name{font-size:14px;font-weight:600;}
  .app-tile .tag{font-size:11px;color:var(--text-dim);margin-top:4px;}
  .app-tile.live::before{
    content:"";position:absolute;top:0;left:0;right:0;height:3px;
    background:linear-gradient(90deg,var(--accent),var(--accent-2));
  }
  .app-tile.dead .tag{color:var(--danger);}

  /* HORARIOS */
  #horarios .week-nav{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;}
  #horarios .week-nav button{background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:8px 14px;font-size:14px;box-shadow:var(--shadow);}
  #horarios .week-nav .label{font-size:14px;font-weight:600;}
  .day-row{
    display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--border);
  }
  .day-row .dow{width:64px;flex-shrink:0;}
  .day-row .dow .d{font-size:13px;font-weight:600;}
  .day-row .dow .n{font-size:11px;color:var(--text-dim);}
  .day-row .shift{flex:1;background:var(--accent-dim);color:var(--accent);border-radius:10px;padding:10px 12px;font-size:13px;font-weight:600;}
  .day-row .shift.empty{color:var(--text-dim);border:1px dashed var(--border);background:none;text-align:center;font-weight:400;}
  .day-row .shift.fc{background:#e2f8f5;color:var(--fc);font-style:normal;}
  .day-row .shift.fo{background:#fdece4;color:var(--fo);font-style:normal;}
  .day-row .shift .warn{color:var(--danger);font-size:11px;margin-top:4px;font-weight:400;}
  .day-row .shift .night{color:#8b5cf6;}

  .fab{
    position:fixed;bottom:24px;right:20px;width:56px;height:56px;border-radius:50%;
    background:linear-gradient(145deg,var(--accent-2),var(--accent));color:#fff;border:none;font-size:26px;
    box-shadow:0 10px 22px rgba(53,104,240,.35);
  }

  .tabbar{
    display:flex;gap:4px;margin:14px 20px;padding:4px;background:var(--card);
    border:1px solid var(--border);border-radius:999px;box-shadow:var(--shadow);
  }
  .tabbar button{
    flex:1;background:none;border:none;color:var(--text-dim);font-size:12.5px;font-weight:600;display:flex;
    flex-direction:row;align-items:center;justify-content:center;gap:5px;padding:9px 0;border-radius:999px;transition:.15s;
  }
  .tabbar button .ic{font-size:14px;}
  .tabbar button.active{color:#fff;background:linear-gradient(145deg,var(--accent-2),var(--accent));}

  /* MODAL */
  .modal-bg{
    position:fixed;inset:0;background:rgba(20,26,44,.45);display:none;align-items:flex-end;z-index:50;
  }
  .modal-bg.active{display:flex;}
  .modal{
    background:var(--bg-elev);width:100%;border-radius:20px 20px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));
    max-height:85vh;overflow-y:auto;box-shadow:0 -8px 30px rgba(20,30,60,.12);
  }
  .modal h3{margin:0 0 18px;font-size:17px;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:6px;}
  .field select, .field input{
    width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);
    border-radius:10px;padding:12px;font-size:15px;
  }
  .row2{display:flex;gap:12px;}
  .row2 .field{flex:1;}
  .modal-actions{display:flex;gap:10px;margin-top:8px;}
  .btn{flex:1;padding:14px;border-radius:12px;border:none;font-size:15px;font-weight:600;}
  .btn.primary{background:linear-gradient(145deg,var(--accent-2),var(--accent));color:#fff;}
  .btn.ghost{background:var(--bg);color:var(--text);border:1px solid var(--border);}
  .legal-note{
    background:var(--accent-dim);color:var(--accent);font-size:12px;padding:10px 12px;
    border-radius:10px;margin-bottom:16px;line-height:1.5;
  }
  .legal-note.err{background:var(--danger-dim);color:var(--danger);}

  /* VIEW SWITCH */
  .view-switch{display:flex;gap:4px;margin:0 20px 14px;padding:4px;background:var(--card);border:1px solid var(--border);border-radius:999px;box-shadow:var(--shadow);}
  .view-switch button{flex:1;background:none;border:none;color:var(--text-dim);border-radius:999px;padding:9px;font-size:12.5px;font-weight:600;}
  .view-switch button.active{background:var(--accent-dim);color:var(--accent);}

  /* VISTA MENSAL */
  .mensal-wrap{overflow-x:auto;padding:0 0 90px;-webkit-overflow-scrolling:touch;}
  table.mensal-grid{border-collapse:collapse;font-size:11px;white-space:nowrap;}
  table.mensal-grid th, table.mensal-grid td{border:1px solid var(--border);padding:6px 5px;text-align:center;}
  table.mensal-grid th.func-col, table.mensal-grid td.func-col{
    position:sticky;left:0;background:var(--bg-elev);text-align:left;padding:8px 10px;z-index:2;font-weight:600;min-width:110px;
  }
  table.mensal-grid th{background:#eef1f8;color:var(--text-dim);font-weight:700;min-width:34px;}
  table.mensal-grid th.weekend{color:var(--fo);}
  table.mensal-grid td{min-width:34px;color:var(--text-dim);cursor:pointer;}
  table.mensal-grid td.turno{background:linear-gradient(145deg,var(--accent-2),var(--accent));color:#fff;font-weight:700;cursor:pointer;}
  table.mensal-grid td.turno.noturno{background:linear-gradient(145deg,#a78bfa,#8b5cf6);}
  table.mensal-grid td.fc{background:var(--fc);color:#fff;font-weight:700;cursor:pointer;}
  table.mensal-grid td.fo{background:var(--fo);color:#fff;font-weight:700;cursor:pointer;}

  /* VISTA DIÁRIA */
  .diario-daypicker{display:flex;align-items:center;justify-content:space-between;padding:0 20px 14px;}
  .diario-daypicker input{background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:9px 12px;font-size:14px;}
  .diario-wrap{overflow-x:auto;padding:0 20px 90px;-webkit-overflow-scrolling:touch;}
  .diario-timeline{position:relative;min-width:1000px;}
  .diario-hours{display:flex;border-bottom:1px solid var(--border);margin-left:110px;}
  .diario-hours .h{flex-shrink:0;width:40px;font-size:10px;color:var(--text-dim);text-align:left;padding:4px 0;border-left:1px solid var(--border);}
  .diario-row{display:flex;align-items:center;border-bottom:1px solid var(--border);min-height:44px;position:relative;}
  .diario-row .name{width:110px;flex-shrink:0;font-size:12px;font-weight:600;padding-right:8px;}
  .diario-row .track{position:relative;flex:1;height:32px;background:repeating-linear-gradient(to right, var(--border) 0 1px, transparent 1px 40px);}
  .diario-bar{position:absolute;top:2px;height:28px;background:linear-gradient(145deg,var(--accent-2),var(--accent));border-radius:6px;font-size:10px;color:#fff;font-weight:700;display:flex;align-items:center;padding:0 6px;overflow:hidden;white-space:nowrap;box-shadow:0 2px 6px rgba(53,104,240,.25);}
  .diario-bar.noturno{background:linear-gradient(145deg,#a78bfa,#8b5cf6);box-shadow:0 2px 6px rgba(139,92,246,.25);}
  .diario-bar.fc{background:var(--fc);box-shadow:0 2px 6px rgba(18,179,160,.25);}
  .diario-bar.fo{background:var(--fo);box-shadow:0 2px 6px rgba(242,103,61,.25);}
  .diario-bar.editable{cursor:grab;touch-action:none;}
  .diario-bar.dragging{opacity:.75;z-index:5;box-shadow:0 4px 12px rgba(0,0,0,.25);}
  .diario-bar.almoco{background:#eef1f7;color:var(--text-dim);border:1px dashed #b9c2d6;z-index:2;box-shadow:none;}

  /* EQUIPA */
  #equipa-list{padding:16px 20px 90px;}
  .colab-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;box-shadow:var(--shadow);}
  .colab-card .info .nome{font-size:14px;font-weight:600;}
  .colab-card .info .user{font-size:12px;color:var(--text-dim);margin-top:2px;}

  #ferias-list{padding:16px 20px;}
  .fer-card{
    background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow);
  }
  .fer-card .dates{font-size:14px;font-weight:600;}
  .fer-card .status{font-size:11px;margin-top:4px;display:inline-block;padding:3px 8px;border-radius:20px;font-weight:600;}
  .status.pendente{background:var(--warn-dim);color:var(--warn);}
  .status.aprovado{background:var(--ok-dim);color:var(--ok);}
  .status.recusado{background:var(--danger-dim);color:var(--danger);}
  .empty-state{text-align:center;padding:60px 30px;color:var(--text-dim);}
  .empty-state .ic{font-size:40px;margin-bottom:12px;}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login" class="screen active">
  <div class="login-box">
    <div class="logo">🕒</div>
    <h2>CJ Horários</h2>
    <p>Entra com o teu utilizador</p>
    <div class="field" style="text-align:left">
      <label>Utilizador</label>
      <input type="text" id="loginUsername" autocapitalize="none" autocomplete="username">
    </div>
    <div class="field" style="text-align:left">
      <label>Password</label>
      <input type="password" id="loginPassword" autocomplete="current-password">
    </div>
    <button class="btn primary" style="width:100%" onclick="tentarLogin()">Entrar</button>
    <div id="login-error"></div>
  </div>
</div>

<!-- HUB CJ -->
<div id="hub" class="screen">
  <header class="top">
    <div>
      <h1 id="hub-empresa">CJ</h1>
      <div class="sub" id="hub-user"></div>
    </div>
    <button class="btn-icon" onclick="logout()">Sair</button>
  </header>
  <div class="apps-grid" id="appsGrid"></div>
</div>

<!-- HORARIOS -->
<div id="horarios" class="screen">
  <header class="top">
    <div>
      <h1>Horários</h1>
      <div class="sub" id="hor-loja"></div>
    </div>
    <button class="btn-icon" onclick="showScreen('hub')">✕</button>
  </header>

  <div class="tabbar">
    <button class="tab-btn active" data-tab="semana" onclick="switchTab('semana')">
      <span class="ic">📅</span>Horário
    </button>
    <button class="tab-btn" data-tab="equipa" onclick="switchTab('equipa')">
      <span class="ic">👥</span>Equipa
    </button>
  </div>

  <div class="view-switch">
    <button id="vs-mensal" class="active" onclick="mudarVistaCalendario('mensal')">Mensal</button>
    <button id="vs-diario" onclick="mudarVistaCalendario('diario')">Diária</button>
  </div>

  <!-- VISTA SEMANA (mantida no código para a app de equipa reaproveitar a lógica, mas não é mostrada ao gerente) -->
  <div id="calSemana" style="display:none">
    <div class="week-nav">
      <button onclick="changeWeek(-1)">‹ Anterior</button>
      <div class="label" id="weekLabel"></div>
      <button onclick="changeWeek(1)">Seguinte ›</button>
    </div>
    <div id="weekList"></div>
  </div>

  <!-- VISTA MENSAL -->
  <div id="calMensal" style="display:none">
    <div class="week-nav">
      <button onclick="changeMonth(-1)">‹ Anterior</button>
      <div class="label" id="monthLabel"></div>
      <button onclick="changeMonth(1)">Seguinte ›</button>
    </div>
    <div class="mensal-wrap"><table class="mensal-grid" id="mensalGrid"></table></div>
  </div>

  <!-- VISTA DIÁRIA -->
  <div id="calDiario" style="display:none">
    <div class="diario-daypicker">
      <button onclick="changeDay(-1)">‹</button>
      <input type="date" id="diarioDate" onchange="carregarDiario()">
      <button onclick="changeDay(1)">›</button>
    </div>
    <div class="diario-wrap"><div class="diario-timeline" id="diarioTimeline"></div></div>
  </div>

  <button class="fab" id="fabAdd" onclick="openTurnoModal()">+</button>
</div>

<!-- EQUIPA (colaboradores + pedidos de férias) -->
<div id="equipa-tab" class="screen">
  <header class="top">
    <div><h1>Equipa</h1><div class="sub" id="equipa-loja"></div></div>
    <button class="btn-icon" onclick="showScreen('hub')">✕</button>
  </header>
  <div class="tabbar">
    <button class="tab-btn" data-tab="semana" onclick="goHorariosTab('semana')">
      <span class="ic">📅</span>Horário
    </button>
    <button class="tab-btn active" data-tab="equipa" onclick="goHorariosTab('equipa')">
      <span class="ic">👥</span>Equipa
    </button>
  </div>
  <div style="padding:16px 20px 0;font-size:13px;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:.4px;">Colaboradores</div>
  <div id="equipa-list"></div>
  <div style="padding:8px 20px 0;font-size:13px;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:.4px;">Pedidos de férias</div>
  <div id="equipa-ferias-list"></div>
  <button class="fab" onclick="openColabModal()">+</button>
</div>

<!-- MODAL TURNO -->
<div class="modal-bg" id="modalTurno">
  <div class="modal">
    <h3>Novo turno</h3>
    <div id="turnoLegalNote"></div>
    <div class="field">
      <label>Funcionário</label>
      <select id="tFuncionario"></select>
    </div>
    <div class="field">
      <label>Data</label>
      <input type="date" id="tData">
    </div>
    <div class="row2">
      <div class="field">
        <label>Início</label>
        <input type="time" id="tInicio">
      </div>
      <div class="field">
        <label>Fim</label>
        <input type="time" id="tFim">
      </div>
    </div>
    <div class="field" id="tAlmocoWrap">
      <label>Horas de almoço</label>
      <input type="number" id="tAlmoco" min="0" step="0.5" value="1" placeholder="ex: 1 ou 1.5">
    </div>
    <div class="field">
      <label>Tipo</label>
      <select id="tTipo">
        <option value="turno">Turno de trabalho</option>
        <option value="folga_complementar">Folga Complementar (FC)</option>
        <option value="folga_obrigatoria">Folga Obrigatória (FO)</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeModal('modalTurno')">Cancelar</button>
      <button class="btn primary" onclick="guardarTurno()">Guardar</button>
    </div>
    <button class="btn" id="btnEliminarTurno" style="display:none;width:100%;margin-top:10px;background:#3a1a17;color:var(--danger);" onclick="eliminarTurno()">Eliminar turno</button>
  </div>
</div>

<!-- MODAL COLABORADOR -->
<div class="modal-bg" id="modalColab">
  <div class="modal">
    <h3 id="colabModalTitulo">Novo colaborador</h3>
    <div style="padding:8px 0 0;font-size:12px;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:.4px;">Dados pessoais</div>
    <div class="field">
      <label>Nome</label>
      <input type="text" id="cNome" placeholder="Nome completo">
    </div>
    <div class="row2">
      <div class="field">
        <label>Telemóvel</label>
        <input type="tel" id="cTelemovel" placeholder="ex: 912345678">
      </div>
      <div class="field">
        <label>Email</label>
        <input type="email" id="cEmail" placeholder="email@exemplo.pt">
      </div>
    </div>
    <div style="padding:8px 0 0;font-size:12px;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:.4px;">Admissão</div>
    <div class="row2">
      <div class="field">
        <label>Data de admissão</label>
        <input type="date" id="cDataAdmissao">
      </div>
      <div class="field">
        <label>Tipo de contrato</label>
        <select id="cTipoContrato">
          <option value="">Selecionar...</option>
          <option value="Sem termo">Sem termo (efetivo)</option>
          <option value="Termo certo">Termo certo</option>
          <option value="Termo incerto">Termo incerto</option>
          <option value="Part-time">Part-time</option>
          <option value="Prestação de serviços">Prestação de serviços</option>
        </select>
      </div>
    </div>
    <div style="padding:8px 0 0;font-size:12px;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:.4px;">Acesso à app</div>
    <div class="field">
      <label>Utilizador (login na app do funcionário)</label>
      <input type="text" id="cUsername" placeholder="ex: joana.silva" autocapitalize="none">
    </div>
    <div class="field" id="cPasswordWrap">
      <label>Password inicial</label>
      <input type="text" id="cPassword" placeholder="Define uma password">
    </div>
    <div id="colabError" style="color:var(--danger);font-size:12px;margin-bottom:8px;"></div>
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeModal('modalColab')">Cancelar</button>
      <button class="btn primary" onclick="guardarColab()">Guardar</button>
    </div>
    <button class="btn" id="btnEliminarColab" style="display:none;width:100%;margin-top:10px;background:var(--danger-dim);color:var(--danger);" onclick="eliminarColab()">Desativar colaborador</button>
  </div>

</div>

<script>
/* ============================================================
   CJ HORÁRIOS — app principal
   Ligação ao Supabase do projeto CJ-Horarios (separado do BAGGA)
   ============================================================ */
const SUPABASE_URL = "https://mnbtfatkdllhsekmnpzk.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1uYnRmYXRrZGxsaHNla21ucHprIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcwODMyNjYsImV4cCI6MjEwMjY1OTI2Nn0.pPHvX8HStZ7vqK_LqlTUG33YPITGzbwkjEfHovTxbSA";

async function sb(path, opts = {}) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    ...opts,
    headers: {
      "apikey": SUPABASE_KEY,
      "Authorization": `Bearer ${SUPABASE_KEY}`,
      "Content-Type": "application/json",
      "Prefer": opts.prefer || "return=representation",
      ...(opts.headers || {})
    }
  });
  if (!res.ok) { const errText = await res.text(); console.error(errText); throw new Error(errText); }
  return res.status === 204 ? null : res.json();
}

async function tentarLogin() {
  const errEl = document.getElementById("login-error");
  errEl.textContent = "";
  const username = document.getElementById("loginUsername").value.trim().toLowerCase();
  const password = document.getElementById("loginPassword").value;
  if (!username || !password) { errEl.textContent = "Preenche o utilizador e a password."; return; }
  try {
    const password_hash = await sha256Hex(password);
    const users = await sb(`cj_utilizadores?username=eq.${encodeURIComponent(username)}&password_hash=eq.${password_hash}&ativo=eq.true&papel=eq.gerente&select=*`);
    if (!users.length) throw new Error("Credenciais inválidas");
    state.user = users[0];
    const empresas = await sb(`cj_empresas?id=eq.${state.user.empresa_id}&select=*`);
    state.empresa = empresas[0];
    let lojaId = state.user.loja_id;
    if (!lojaId) {

      lojaId = lojas[0]?.id;
    }
    const lojaRows = await sb(`cj_lojas?id=eq.${lojaId}&select=*`);
    state.loja = lojaRows[0];

  } catch (e) {
    errEl.textContent = "Utilizador ou password incorretos";
  }
}

/* ---------- HORÁRIOS: semana ---------- */
function startOfWeek(d) {
  const date = new Date(d);
  const day = (date.getDay() + 6) % 7; // segunda = 0
  date.setDate(date.getDate() - day);
  date.setHours(0,0,0,0);
  return date;
}
async function abrirHorarios() {
  state.weekStart = startOfWeek(new Date());
  document.getElementById("hor-loja").textContent = `${state.loja?.nome || ""} · ${state.user.nome}`;
  document.getElementById("fabAdd").style.display = state.user.papel === "gerente" ? "flex" : "none";
  state.utilizadoresLoja = await sb(`cj_utilizadores?loja_id=eq.${state.loja.id}&ativo=eq.true&select=*&order=nome`);
  state.monthDate = new Date();
  showScreen("horarios");
  mudarVistaCalendario("mensal");
}
function changeWeek(delta) {
  state.weekStart.setDate(state.weekStart.getDate() + delta * 7);
  carregarSemana();
}
function fmtDate(d) { return d.toISOString().slice(0,10); }
function fmtLabel(d) {
  return d.toLocaleDateString("pt-PT", { day: "2-digit", month: "short" });
}
async function carregarSemana() {
  const start = new Date(state.weekStart);
  const end = new Date(start); end.setDate(end.getDate() + 6);
  document.getElementById("weekLabel").textContent = `${fmtLabel(start)} – ${fmtLabel(end)}`;

  let filtro = `loja_id=eq.${state.loja.id}&data=gte.${fmtDate(start)}&data=lte.${fmtDate(end)}`;
  if (state.user.papel !== "gerente") filtro += `&utilizador_id=eq.${state.user.id}`;
  state.turnos = await sb(`cj_horarios_turnos?${filtro}&select=*&order=data`);

  const dias = ["Seg","Ter","Qua","Qui","Sex","Sáb","Dom"];
  const list = document.getElementById("weekList");
  list.innerHTML = "";

  for (let i = 0; i < 7; i++) {
    const d = new Date(start); d.setDate(d.getDate() + i);
    const iso = fmtDate(d);
    const turnosDia = state.turnos.filter(t => t.data === iso);

    const row = document.createElement("div");
    row.className = "day-row";
    const dowHtml = `<div class="dow"><div class="d">${dias[i]}</div><div class="n">${d.getDate()}/${d.getMonth()+1}</div></div>`;

    if (!turnosDia.length) {
      row.innerHTML = dowHtml + `<div class="shift empty">Sem turno</div>`;
    } else {
      const shiftsHtml = turnosDia.map(t => {
        if (t.tipo === "folga_complementar") return `<div class="shift fc">FC — Folga Complementar</div>`;
        if (t.tipo === "folga_obrigatoria") return `<div class="shift fo">FO — Folga Obrigatória</div>`;
        const warn = checkDescansoMinimo(t, state.turnos);
        return `<div class="shift">
          ${t.hora_inicio?.slice(0,5)} – ${t.hora_fim?.slice(0,5)}
          ${t.noturno ? '<span class="night"> · noturno</span>' : ''}
          ${warn ? `<div class="warn">⚠️ ${warn}</div>` : ''}
        </div>`;
      }).join("");
      row.innerHTML = dowHtml + shiftsHtml;
    }
    list.appendChild(row);
  }
}

/* ---------- VISTA DIÁRIA: horas em coluna (30 min), colaboradores em linha ---------- */
const DIARIO_INICIO_H = 6;   // 06:00
const DIARIO_FIM_H = 26;     // até às 02:00 do dia seguinte, para cobrir noturnos
function changeDay(delta) {
  const input = document.getElementById("diarioDate");
  const d = new Date(input.value || fmtDate(new Date()));
  d.setDate(d.getDate() + delta);
  input.value = fmtDate(d);
  carregarDiario();
}
function horaParaMinutos(hhmm, cruzaMeiaNoite) {
  if (!hhmm) return null;
  const [h, m] = hhmm.split(":").map(Number);
  let total = h * 60 + m;
  if (cruzaMeiaNoite && h < DIARIO_INICIO_H) total += 24 * 60;
  return total;
}
async function carregarDiario() {
  const iso = document.getElementById("diarioDate").value;
  if (!iso) return;

  const turnos = await sb(`cj_horarios_turnos?loja_id=eq.${state.loja.id}&data=eq.${iso}&select=*`);
  state.turnosDiario = turnos;

  const idsComFolga = new Set(turnos.filter(t => t.tipo === "folga_complementar" || t.tipo === "folga_obrigatoria").map(t => t.utilizador_id));
  const utilizadoresVisiveis = state.utilizadoresLoja.filter(u => !idsComFolga.has(u.id));

  const totalMin = (DIARIO_FIM_H - DIARIO_INICIO_H) * 60;
  let hoursHtml = "";
  for (let h = DIARIO_INICIO_H; h <= DIARIO_FIM_H; h++) {
    hoursHtml += `<div class="h" style="width:40px">${String(h % 24).padStart(2,"0")}:00</div>`;
  }

  let rowsHtml = "";
  utilizadoresVisiveis.forEach(u => {
    const turnosUser = turnos.filter(t => t.utilizador_id === u.id && t.tipo === "turno" && t.hora_inicio && t.hora_fim);
    let barsHtml = "";
    turnosUser.forEach(t => {
      let ini = horaParaMinutos(t.hora_inicio, false);
      let fim = horaParaMinutos(t.hora_fim, false);
      if (fim <= ini) fim += 24 * 60; // cruza meia-noite
      const iniRel = Math.max(0, ini - DIARIO_INICIO_H * 60);
      const fimRel = Math.min(totalMin, fim - DIARIO_INICIO_H * 60);
      if (fimRel <= 0 || iniRel >= totalMin) return;
      const leftPx = (iniRel / 30) * 20;   // 20px por cada 30min (40px por hora)
      const widthPx = ((fimRel - iniRel) / 30) * 20;
      barsHtml += `<div class="diario-bar editable ${t.noturno ? 'noturno' : ''}" data-turno-id="${t.id}" style="left:${leftPx}px;width:${widthPx}px">${t.hora_inicio.slice(0,5)}-${t.hora_fim.slice(0,5)}</div>`;

      // bloco de almoço, colocado automaticamente a meio do turno
      const almocoMin = (t.almoco_horas || 0) * 60;
      if (almocoMin > 0 && (fim - ini) > almocoMin) {
        const trabalhoMin = fim - ini - almocoMin;
        let almocoInicioAbs = ini + Math.round(trabalhoMin / 2 / 30) * 30; // centra e arredonda a 30min
        const almocoFimAbs = almocoInicioAbs + almocoMin;
        const aIniRel = Math.max(0, almocoInicioAbs - DIARIO_INICIO_H * 60);
        const aFimRel = Math.min(totalMin, almocoFimAbs - DIARIO_INICIO_H * 60);
        if (aFimRel > aIniRel) {
          const aLeftPx = (aIniRel / 30) * 20;
          const aWidthPx = ((aFimRel - aIniRel) / 30) * 20;
          const hIni = Math.floor((almocoInicioAbs % 1440) / 60), mIni = almocoInicioAbs % 60;
          barsHtml += `<div class="diario-bar almoco" style="left:${aLeftPx}px;width:${aWidthPx}px" title="Almoço">🍽 ${String(hIni).padStart(2,"0")}:${String(mIni).padStart(2,"0")}</div>`;
        }
      }
    });
    rowsHtml += `<div class="diario-row"><div class="name">${u.nome}</div><div class="track" style="width:${(totalMin/30)*20}px">${barsHtml}</div></div>`;
  });

  document.getElementById("diarioTimeline").innerHTML = `
    <div class="diario-hours">${hoursHtml}</div>
    ${rowsHtml}
  `;
}

/* ---------- EDITAR TURNO NA VISTA DIÁRIA: arrastar ou duplo-toque ---------- */
let dragInfo = null;
let lastTapId = null, lastTapTime = 0;
const PX_POR_30MIN = 20;

document.getElementById("diarioTimeline").addEventListener("pointerdown", (e) => {
  const bar = e.target.closest(".diario-bar.editable");
  if (!bar) return;
  bar.setPointerCapture(e.pointerId);
  dragInfo = {
    turnoId: bar.dataset.turnoId,
    bar,
    startX: e.clientX,
    startLeft: parseFloat(bar.style.left),
    moved: false
  };
});

document.getElementById("diarioTimeline").addEventListener("pointermove", (e) => {
  if (!dragInfo) return;
  const deltaX = e.clientX - dragInfo.startX;
  if (Math.abs(deltaX) > 4) dragInfo.moved = true;
  if (dragInfo.moved) {
    dragInfo.bar.classList.add("dragging");
    dragInfo.bar.style.left = (dragInfo.startLeft + deltaX) + "px";
  }
});

document.getElementById("diarioTimeline").addEventListener("pointerup", async (e) => {
  if (!dragInfo) return;
  const { turnoId, bar, startX, moved } = dragInfo;
  const turno = (state.turnosDiario || []).find(t => String(t.id) === String(turnoId));
  dragInfo = null;
  bar.classList.remove("dragging");

  if (moved && turno) {
    const deltaX = e.clientX - startX;
    const deltaMin = Math.round(deltaX / PX_POR_30MIN) * 30;
    if (deltaMin !== 0) {
      const novosHorarios = deslocarHorario(turno.hora_inicio, turno.hora_fim, deltaMin);
      await sb(`cj_horarios_turnos?id=eq.${turno.id}`, {
        method: "PATCH",
        body: JSON.stringify({ hora_inicio: novosHorarios.inicio, hora_fim: novosHorarios.fim })
      });
    }
    carregarDiario();
    carregarMensal();
  } else if (turno) {
    // não se moveu: conta como toque — verifica duplo-toque
    const agora = Date.now();
    if (lastTapId === turnoId && (agora - lastTapTime) < 400) {
      openTurnoModal(turno);
      lastTapId = null;
    } else {
      lastTapId = turnoId;
      lastTapTime = agora;
    }
  }
});

function deslocarHorario(hora_inicio, hora_fim, deltaMin) {
  const [hi, mi] = hora_inicio.split(":").map(Number);
  const [hf, mf] = hora_fim.split(":").map(Number);
  let iniMin = (hi * 60 + mi + deltaMin + 1440) % 1440;
  let fimMin = (hf * 60 + mf + deltaMin + 1440) % 1440;
  const fmt = (min) => `${String(Math.floor(min/60)).padStart(2,"0")}:${String(min%60).padStart(2,"0")}`;
  return { inicio: fmt(iniMin), fim: fmt(fimMin) };
}

/* ---------- GESTÃO DE EQUIPA ---------- */
async function sha256Hex(texto) {
  const enc = new TextEncoder().encode(texto);
  const buf = await crypto.subtle.digest("SHA-256", enc);
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
}

/* Validação simplificada: descanso mínimo de 11h entre turnos consecutivos */
function checkDescansoMinimo(turno, todos) {
  if (!turno.hora_inicio) return null;
  const dataTurno = new Date(`${turno.data}T${turno.hora_inicio}`);
  const diaAnterior = new Date(dataTurno); diaAnterior.setDate(diaAnterior.getDate() - 1);
  const anteriorIso = fmtDate(diaAnterior);
  const turnoAnterior = todos.find(t => t.data === anteriorIso && t.hora_fim && t.utilizador_id === turno.utilizador_id);
  if (!turnoAnterior) return null;
  const fimAnterior = new Date(`${turnoAnterior.data}T${turnoAnterior.hora_fim}`);
  const diffH = (dataTurno - fimAnterior) / 3600000;
  if (diffH >= 0 && diffH < 11) return `Só ${diffH.toFixed(1)}h de descanso desde o turno anterior (mínimo legal: 11h)`;
  return null;
}

/* ---------- MODAL NOVO TURNO ---------- */
function openTurnoModal(turno, prefill) {
  const sel = document.getElementById("tFuncionario");
  sel.innerHTML = state.utilizadoresLoja.map(u => `<option value="${u.id}">${u.nome}</option>`).join("");
  document.getElementById("turnoLegalNote").innerHTML = "";
  if (turno) {
    state.editingTurnoId = turno.id;
    sel.value = turno.utilizador_id;
    document.getElementById("tData").value = turno.data;
    document.getElementById("tInicio").value = turno.hora_inicio ? turno.hora_inicio.slice(0,5) : "";
    document.getElementById("tFim").value = turno.hora_fim ? turno.hora_fim.slice(0,5) : "";
    document.getElementById("tTipo").value = turno.tipo;
    document.getElementById("tAlmoco").value = String(turno.almoco_horas ?? 1);
    document.getElementById("tAlmocoWrap").style.display = turno.tipo === "turno" ? "block" : "none";
    document.getElementById("btnEliminarTurno").style.display = "block";
  } else {
    state.editingTurnoId = null;
    // data por defeito: a que estava selecionada na vista (diária/célula), senão hoje
    let dataDefeito = fmtDate(new Date());
    if (prefill?.data) dataDefeito = prefill.data;
    else if (document.getElementById("calDiario").style.display === "block") {
      dataDefeito = document.getElementById("diarioDate").value || dataDefeito;
    }
    document.getElementById("tData").value = dataDefeito;
    if (prefill?.utilizador_id) sel.value = prefill.utilizador_id;
    document.getElementById("tInicio").value = "";
    document.getElementById("tFim").value = "";
    document.getElementById("tTipo").value = "turno";
    document.getElementById("tAlmoco").value = "1";
    document.getElementById("tAlmocoWrap").style.display = "block";
    document.getElementById("btnEliminarTurno").style.display = "none";
  }
  document.getElementById("modalTurno").classList.add("active");
}
document.getElementById("tTipo").addEventListener("change", async (e) => {
  document.getElementById("tAlmocoWrap").style.display = e.target.value === "turno" ? "block" : "none";
  if (!state.editingTurnoId && (e.target.value === "folga_complementar" || e.target.value === "folga_obrigatoria")) {
    const utilizador_id = document.getElementById("tFuncionario").value;
    const data = document.getElementById("tData").value;
    if (utilizador_id && data) {
      const tipoCorreto = await determinarTipoFolga(utilizador_id, data);
      document.getElementById("tTipo").value = tipoCorreto;
      document.getElementById("turnoLegalNote").innerHTML = tipoCorreto === "folga_obrigatoria"
        ? `<div class="legal-note">Definida como <b>Folga Obrigatória (FO)</b> — ainda não há folga esta semana.</div>`
        : `<div class="legal-note">Definida como <b>Folga Complementar (FC)</b> — já existe uma Folga Obrigatória esta semana.</div>`;
    }
  } else {
    document.getElementById("turnoLegalNote").innerHTML = "";
  }
});
async function determinarTipoFolga(utilizador_id, dataStr, excluirId) {
  const dataRef = new Date(dataStr);
  const inicio = startOfWeek(dataRef);
  const fim = new Date(inicio); fim.setDate(fim.getDate() + 6);
  const turnos = await sb(`cj_horarios_turnos?utilizador_id=eq.${utilizador_id}&data=gte.${fmtDate(inicio)}&data=lte.${fmtDate(fim)}&select=id,tipo`);
  const folgasExistentes = turnos.filter(t => (t.tipo === "folga_complementar" || t.tipo === "folga_obrigatoria") && t.id !== excluirId);
  return folgasExistentes.length === 0 ? "folga_obrigatoria" : "folga_complementar";
}
function closeModal(id) { document.getElementById(id).classList.remove("active"); }

function isNoturno(inicio, fim) {
  if (!inicio || !fim) return false;
  const [hi] = inicio.split(":").map(Number);
  const [hf] = fim.split(":").map(Number);
  return hi >= 22 || hi < 7 || hf <= 7 || hf > 22;
}

async function guardarTurno() {
  const utilizador_id = document.getElementById("tFuncionario").value;
  const data = document.getElementById("tData").value;
  const hora_inicio = document.getElementById("tInicio").value || null;
  const hora_fim = document.getElementById("tFim").value || null;
  let tipo = document.getElementById("tTipo").value;
  const almoco_horas = tipo === "turno" ? parseFloat(document.getElementById("tAlmoco").value) : 0;

  if (!data || (tipo === "turno" && (!hora_inicio || !hora_fim))) {
    document.getElementById("turnoLegalNote").innerHTML = `<div class="legal-note err">Preenche a data e as horas do turno.</div>`;
    return;
  }

  // garante FC/FO corretos mesmo que a data/funcionário tenham mudado depois de escolher o tipo
  if (!state.editingTurnoId && (tipo === "folga_complementar" || tipo === "folga_obrigatoria")) {
    tipo = await determinarTipoFolga(utilizador_id, data);
  }

  const noturno = tipo === "turno" && isNoturno(hora_inicio, hora_fim);

  const fake = { data, hora_inicio, utilizador_id };
  const outrosTurnos = state.editingTurnoId ? state.turnos.filter(t => t.id !== state.editingTurnoId) : state.turnos;
  const aviso = tipo === "turno" ? checkDescansoMinimo(fake, outrosTurnos) : null;
  if (aviso) {
    document.getElementById("turnoLegalNote").innerHTML = `<div class="legal-note err">⚠️ ${aviso}. Ainda assim, queres guardar?</div>`;
  }

  const payload = { loja_id: state.loja.id, utilizador_id, data, hora_inicio, hora_fim, tipo, noturno, almoco_horas };

  if (state.editingTurnoId) {
    await sb(`cj_horarios_turnos?id=eq.${state.editingTurnoId}`, { method: "PATCH", body: JSON.stringify(payload) });
  } else {
    await sb("cj_horarios_turnos", { method: "POST", body: JSON.stringify([{ ...payload, criado_por: state.user.id }]) });
  }
  state.editingTurnoId = null;
  closeModal("modalTurno");
  carregarMensal();
  carregarDiario();
}

async function eliminarTurno() {
  if (!state.editingTurnoId) return;
  await sb(`cj_horarios_turnos?id=eq.${state.editingTurnoId}`, { method: "DELETE" });
  state.editingTurnoId = null;
  closeModal("modalTurno");
  carregarMensal();
  carregarDiario();
}

/* ---------- FÉRIAS (dentro da aba Equipa) ---------- */
async function carregarPedidosFerias() {
  const lista = await sb(`cj_horarios_pedidos_ferias?loja_id=eq.${state.loja.id}&select=*&order=data_inicio.desc`);
  const nomeUtilizador = (id) => (state.utilizadoresLoja.find(u => u.id === id) || {}).nome || "—";
  const list = document.getElementById("equipa-ferias-list");
  if (!lista.length) {
    list.innerHTML = `<div class="empty-state"><div class="ic">🌴</div>Ainda não há pedidos de férias</div>`;
    return;
  }
  list.innerHTML = lista.map(f => `
    <div class="fer-card">
      <div class="dates">${nomeUtilizador(f.utilizador_id)}</div>
      <div style="font-size:13px;color:var(--text-dim);margin-top:2px">${new Date(f.data_inicio).toLocaleDateString("pt-PT")} – ${new Date(f.data_fim).toLocaleDateString("pt-PT")}</div>
      <span class="status ${f.estado}">${f.estado}</span>
      ${f.estado === "pendente" ? `
        <div style="display:flex;gap:8px;margin-top:10px">
          <button class="btn ghost" style="padding:8px;font-size:12px" onclick="responderFerias('${f.id}','recusado')">Recusar</button>
          <button class="btn primary" style="padding:8px;font-size:12px" onclick="responderFerias('${f.id}','aprovado')">Aprovar</button>
        </div>` : ''}
    </div>
  `).join("");
}
async function responderFerias(id, estado) {
  await sb(`cj_horarios_pedidos_ferias?id=eq.${id}`, {
    method: "PATCH",
    body: JSON.stringify({ estado, respondido_por: state.user.id })
  });
  carregarPedidosFerias();
}

/* ---------- NOTIFICAÇÕES PUSH (preparado, ainda inativo) ----------
   Quando gerarmos as chaves VAPID e tivermos um endpoint no servidor a
   enviar pushes (ex: edge function no Supabase), basta:
   1. Substituir VAPID_PUBLIC_KEY abaixo pela chave pública real
   2. Chamar pedirPermissaoNotificacoes() depois do login
   A tabela cj_push_subscriptions já existe e guarda a subscrição. */
const VAPID_PUBLIC_KEY = ""; // preencher quando gerarmos as chaves

function urlBase64ToUint8Array(base64String) {
  const padding = "=".repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
  const rawData = atob(base64);
  return Uint8Array.from([...rawData].map(c => c.charCodeAt(0)));
}

async function pedirPermissaoNotificacoes() {
  if (!VAPID_PUBLIC_KEY || !("serviceWorker" in navigator) || !("PushManager" in window)) return;
  const permission = await Notification.requestPermission();
  if (permission !== "granted") return;
  const reg = await navigator.serviceWorker.ready;
  const sub = await reg.pushManager.subscribe({
    userVisibleOnly: true,
    applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
  });
  const json = sub.toJSON();
  await sb("cj_push_subscriptions", {
    method: "POST",
    body: JSON.stringify([{
      utilizador_id: state.user.id,
      endpoint: json.endpoint,
      p256dh: json.keys.p256dh,
      auth: json.keys.auth
    }]),
    prefer: "resolution=merge-duplicates"
  });
}
